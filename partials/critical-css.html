  <style>
    /* Critical CSS: header/nav rendered avant le chargement de css/style.css */
    :root{--color-bg:#0a0a0a;--color-bg-rgb:10,10,10;--color-bg-alt:#141414;--color-text:#e0e0e0;--color-text-muted:#9a9a9a;--color-primary:#64ffda;--color-primary-rgb:100,255,218;--color-primary-hover:#8effe6;--color-primary-contrast:#0a0a0a;--color-border:#2a2a2a;--font-family-base:'Inter',system-ui,sans-serif;--font-size-base:1.1rem;--line-height-base:1.7;--spacing-sm:0.5rem;--spacing-md:1rem;--spacing-lg:2rem;--spacing-xl:4rem;--header-height:4rem}
    :root[data-theme="light"]{--color-bg:#ffffff;--color-bg-rgb:255,255,255;--color-bg-alt:#f5f5f5;--color-text:#1a1a1a;--color-text-muted:#5c5c5c;--color-primary:#0a7a5e;--color-primary-rgb:10,122,94;--color-primary-hover:#07614a;--color-primary-contrast:#ffffff;--color-border:#e0e0e0}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
    a{color:inherit;text-decoration:none}
    button{font:inherit;border:none;background:none;cursor:pointer}
    body{font-family:var(--font-family-base);font-size:var(--font-size-base);line-height:var(--line-height-base);background-color:var(--color-bg);color:var(--color-text)}
    .skip-link{position:absolute;top:-100%;left:1rem;z-index:300;padding:.5rem 1rem;background-color:var(--color-primary);color:var(--color-primary-contrast);border-radius:.375rem;font-weight:600}
    .skip-link:focus{top:1rem}
    .site-header{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--header-height);border-bottom:1px solid var(--color-border);transition:box-shadow .3s ease}
    .site-header::before{content:"";position:absolute;inset:0;z-index:-1;background-color:rgba(var(--color-bg-rgb),.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
    .nav{height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 var(--spacing-lg)}
    .nav__logo{font-weight:700;z-index:200}
    .nav__right{display:flex;align-items:center;gap:var(--spacing-md)}
    .theme-toggle{font-size:1.25rem;line-height:1;z-index:200}
  </style>
